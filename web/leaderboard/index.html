<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Leaderboard - Hop 'n Bop</title>
	<link rel="stylesheet" href="/style.css">
	<style>
		.board-summary {
			color: #aaa;
			margin: -0.5rem 0 0;
		}

		#leaderboard th.rank,
		#leaderboard td.rank {
			width: 3.5rem;
			text-align: right;
			font-variant-numeric: tabular-nums;
		}

		#leaderboard th.score,
		#leaderboard td.score {
			text-align: right;
			white-space: nowrap;
			font-variant-numeric: tabular-nums;
		}

		/* Player-chosen names: keep right-to-left text from
		   reordering the row, and let long names wrap. */
		#leaderboard td.player {
			unicode-bidi: isolate;
			overflow-wrap: anywhere;
		}

		#leaderboard tr.rank-1 td.rank { color: #f2c94c; font-weight: 700; }
		#leaderboard tr.rank-2 td.rank { color: #c9d1d9; font-weight: 700; }
		#leaderboard tr.rank-3 td.rank { color: #d4945a; font-weight: 700; }

		#leaderboard td.status-message button {
			margin-top: 0.75rem;
			background: #2a2a4a;
			color: #ccc;
			border: 1px solid #3a3a5a;
			padding: 0.4rem 1rem;
			border-radius: 4px;
			cursor: pointer;
			font-size: 0.85rem;
		}

		#leaderboard td.status-message button:hover {
			background: #3a3a5a;
		}

		.board-note {
			color: #888;
			font-size: 0.85rem;
		}

		/* Read by screen readers, not shown. */
		.visually-hidden {
			position: absolute;
			width: 1px;
			height: 1px;
			margin: -1px;
			padding: 0;
			overflow: hidden;
			clip: rect(0 0 0 0);
			white-space: nowrap;
			border: 0;
		}
	</style>
</head>

<body>
	<nav>
		<a href="/">Play</a>
		<a href="/leaderboard/">Leaderboard</a>
		<a href="/blog/">Blog</a>
	</nav>

	<h1>Leaderboard</h1>
	<p class="board-summary" id="board-summary">
		Each player's best score in a single match, all time.
	</p>

	<table id="leaderboard">
		<thead>
			<tr>
				<th class="rank" scope="col">#</th>
				<th class="player" scope="col">Player</th>
				<th class="score" scope="col" id="score-heading">Best score</th>
			</tr>
		</thead>
		<tbody id="leaderboard-body">
			<tr>
				<td colspan="3" class="status-message">
					<noscript>Turn on JavaScript to see the leaderboard.</noscript>
				</td>
			</tr>
		</tbody>
	</table>
	<div class="visually-hidden" id="announcer" role="status" aria-live="polite"></div>

	<p class="updated" id="updated" hidden></p>
	<p class="board-note">
		Anonymous players aren't listed. Sign in with Google or Facebook
		to appear here under your account's name.
	</p>

	<script>
		// Public, read-only, and cached for 60 seconds by the
		// snoringcat-platform runtime (runtime/leaderboard_public.go).
		// No credential: the endpoint needs none, and this page must
		// never carry one.
		const API_BASE = 'https://nakama.snoringcat.games';
		const LEADERBOARD_PATH = '/snoringcat/leaderboard';
		const GAME_ID = 'hopnbop';
		const BOARD = 'ffa';
		const LIMIT = 100;
		const RESPONSE_VERSION = 1;
		const TIMEOUT_MS = 10000;

		const SCORE_LABELS = {
			best: 'Best score',
			set: 'Latest score',
			incr: 'Total score',
			decr: 'Score',
		};
		const SUMMARIES = {
			best: "Each player's best score in a single match",
			set: "Each player's latest score",
			incr: "Each player's total score",
			decr: "Each player's score",
		};

		const table = document.getElementById('leaderboard');
		const tbody = document.getElementById('leaderboard-body');
		const scoreHeading = document.getElementById('score-heading');
		const summary = document.getElementById('board-summary');
		const updated = document.getElementById('updated');
		const announcer = document.getElementById('announcer');

		let isLoading = false;

		// Replaces the table body with one full-width message row,
		// and announces it. Text only: nothing on this page is ever
		// parsed as HTML.
		function showStatus(message, withRetry) {
			announcer.textContent = message;
			const row = document.createElement('tr');
			const cell = document.createElement('td');
			cell.colSpan = 3;
			cell.className = 'status-message';
			cell.append(document.createTextNode(message));
			if (withRetry) {
				const retry = document.createElement('button');
				retry.type = 'button';
				retry.textContent = 'Try again';
				retry.addEventListener('click', loadLeaderboard);
				cell.append(document.createElement('br'), retry);
			}
			row.append(cell);
			tbody.replaceChildren(row);
		}

		function textCell(className, text) {
			const cell = document.createElement('td');
			cell.className = className;
			cell.textContent = text;
			return cell;
		}

		function describeBoard(data) {
			const label = SCORE_LABELS[data.operator] || 'Score';
			scoreHeading.textContent = label;
			let text = SUMMARIES[data.operator] || "Each player's score";
			const nextReset = data.next_reset_at ? new Date(data.next_reset_at) : null;
			if (nextReset && !Number.isNaN(nextReset.getTime())) {
				text += '. Resets ' + nextReset.toLocaleString([], {
					dateStyle: 'medium',
					timeStyle: 'short',
				}) + '.';
			} else {
				text += ', all time.';
			}
			if (data.sort_order === 'asc') {
				text += ' Lower is better.';
			}
			summary.textContent = text;
		}

		function showUpdated(generatedAt) {
			const when = new Date(generatedAt);
			if (Number.isNaN(when.getTime())) {
				updated.hidden = true;
				return;
			}
			updated.textContent = 'Updated ' + when.toLocaleTimeString([], {
				hour: 'numeric',
				minute: '2-digit',
			}) + '. Scores refresh every minute.';
			updated.hidden = false;
		}

		function render(data) {
			describeBoard(data);
			showUpdated(data.generated_at);
			const rows = [];
			for (const entry of data.entries) {
				const rank = Number(entry && entry.rank);
				const score = Number(entry && entry.score);
				const name = entry && typeof entry.display_name === 'string'
					? entry.display_name.trim()
					: '';
				if (!Number.isFinite(rank) || !Number.isFinite(score) || name === '') {
					continue;
				}
				const row = document.createElement('tr');
				if (rank <= 3) {
					row.className = 'rank-' + rank;
				}
				row.append(
					textCell('rank', String(rank)),
					textCell('player', name),
					textCell('score', score.toLocaleString()),
				);
				rows.push(row);
			}
			if (rows.length === 0) {
				showStatus('No scores yet. Finish a match to get on the board.', false);
				return;
			}
			tbody.replaceChildren(...rows);
			announcer.textContent = rows.length === 1
				? 'Showing 1 player.'
				: 'Showing ' + rows.length + ' players.';
		}

		async function loadLeaderboard() {
			if (isLoading) {
				return;
			}
			isLoading = true;
			table.setAttribute('aria-busy', 'true');
			showStatus('Loading…', false);
			const controller = new AbortController();
			const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
			try {
				const url = new URL(LEADERBOARD_PATH, API_BASE);
				url.search = new URLSearchParams({
					game_id: GAME_ID,
					leaderboard: BOARD,
					limit: String(LIMIT),
				}).toString();
				const response = await fetch(url, {
					credentials: 'omit',
					signal: controller.signal,
				});
				if (!response.ok) {
					throw new Error('HTTP ' + response.status);
				}
				const data = await response.json();
				if (!data || data.version !== RESPONSE_VERSION || !Array.isArray(data.entries)) {
					throw new Error('Unexpected leaderboard response');
				}
				render(data);
			} catch (err) {
				updated.hidden = true;
				showStatus("Couldn't load the leaderboard.", true);
				console.error('Leaderboard fetch failed:', err);
			} finally {
				clearTimeout(timer);
				table.removeAttribute('aria-busy');
				isLoading = false;
			}
		}

		loadLeaderboard();
	</script>

	<footer>
		<a href="/privacy/">Privacy</a> &middot;
		<a href="/terms/">Terms</a> &middot;
		<a href="/data-deletion/">Data Deletion</a>
	</footer>
</body>

</html>
