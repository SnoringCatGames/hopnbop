# Hop 'n Bop per-game config.
#
# This file is the declarative source of truth for hopnbop's
# slot on the shared snoringcat-platform Nakama runtime. It is
# synced into the `games` Postgres table at deploy time via
# `scripts/sync-game-config.ps1` (which POSTs to the runtime's
# server-to-server `register_game` RPC).
#
# Schema, semantics, and the multi-game design principles are
# in `third_party/snoringcat-platform/PLATFORM_ARCHITECTURE.md`
# §"Per-game configuration".
#
# WHO OWNS WHAT (2026-07-16)
#
# This file owns everything below EXCEPT the two version fields,
# which are injected at sync time from project.godot:
#
#   - `protocol_version`  <- project.godot::config/protocol_version
#   - `display_version`   <- project.godot::config/version
#
# They used to be duplicated here. `protocol_version` was kept
# honest by a CI parity check; `display_version` was documented as
# "SHOULD match project.godot. Cosmetic only; not CI-guarded" — and
# it duly drifted, sitting at 0.39.0 while the shipped client reached
# 0.47.0, so `version_check` reported a version that hadn't existed
# for months. project.godot is the single source of truth for both
# (see CLAUDE.md "Version Management"); deriving them here removes
# the duplication rather than adding a second guard to police it.
#
# Do not re-add them to this file. sync-game-config.ps1 injects them
# and fails if project.godot can't be read.
#
# Update rules:
#   - `edgegap_app_slug` MUST match the registered app name in
#     Edgegap. Used by `fleet_allocator.go` to allocate deploys.
#   - `edgegap_app_version` / `local_image_ref` are hand-maintained
#     here and this file is their source of truth: game-server.yml
#     pushes the image tag but does NOT write them back. Bump them
#     here in the same change that runs the workflow, or the
#     allocator keeps pulling the old tag.
#   - A bump to `legal_version` sends every player back through
#     the consent screen on their next launch. See the `legal:`
#     block at the bottom for when to sync one.

schema_version: 1

game_id: hopnbop
display_name: "Hop 'n Bop"
edgegap_app_slug: hopnbop-server

# Edgegap registry version tag (`hopnbop-server:v<N>`). Bumped
# after each successful game-server deploy via
# `.github/workflows/game-server.yml`. Stage 3.7 reads this
# per-match from the games table, replacing the manual
# `EDGEGAP_APP_VERSION=v<N>` env var on the Nakama host. Until
# the CI wiring adds an auto-bump step, this value must be
# updated by hand in lockstep with the dashboard's "active
# version" pin.
edgegap_app_version: v30

# Fleet-allocator backend (see runtime/allocator.go for the full
# set). Cost-reduction work (June 2026) added "local" and
# "hybrid" alongside "edgegap":
#   - "edgegap": every match goes to Edgegap.
#   - "local": every match runs on the Nakama host's local Docker
#     daemon. Requires local_image_ref + LOCAL_PUBLIC_IP env on
#     the runtime.
#   - "hybrid": local for matches whose players are all NA-IP,
#     Edgegap for any non-NA player. Per-match decision in
#     hybridAllocatorChoice. Currently uses a coarse static
#     ARIN /8 CIDR map; a real GeoIP path (DB-IP CSV or sidecar)
#     is a follow-up.
allocator_mode: hybrid

# GHCR-hosted game-server image (mirror of the Edgegap registry
# push). The local Docker allocator pulls this tag when
# allocator_mode is "local" or "hybrid". See
# .github/workflows/game-server.yml for the CI step that
# publishes this tag alongside the Edgegap registry push.
local_image_ref: "ghcr.io/snoringcatgames/hopnbop-server:v30"

# protocol_version and display_version are intentionally absent.
# sync-game-config.ps1 injects them from project.godot at sync
# time — see "WHO OWNS WHAT" at the top of this file. Bump them in
# project.godot (config/protocol_version, config/version).

# Container-side ports declared on the game-server image. Each
# port maps to an Edgegap-assigned host port at allocation
# time. Port+1 is the signaling port by convention; see
# CLAUDE.md §"WSS TLS Termination".
ports:
  game: 4433/udp
  signaling: 4434/tcp

# Transport modes the matchmaker hook may select between. The
# actual pick is per-match, based on matched players'
# `platform` attribute (see CLAUDE.md §"Web Build Cross-Play").
transports:
  - enet
  - webrtc

auth_providers:
  - anonymous
  - google
  - facebook

# Matchmaker behavior. Stage 3.8 wires the runtime to read
# these instead of the hardcoded `_MIN_COUNT=2`/`_MAX_COUNT=4`/
# `query="*"` in nakama_matchmaker_client.gd.
matchmaker_rules:
  min_players: 2
  max_players: 4
  # How long a ticket waits before the matchmaker relaxes
  # criteria (drops `platform` preference, etc.) and pairs
  # whoever's queued.
  ticket_expiry_seconds: 60
  # When true, web and native players can match together
  # (transport falls back to WebRTC or WebSocket).
  cross_play: true
  # Free-form rule blocks the matchmaker can apply per-bucket.
  # Reserved for future filters (skill bands, region pinning,
  # block-list enforcement). Empty list = no extra rules.
  rules: []
  # Stage 4.7 / 5.7 game modes. The client picks one before
  # queuing; the runtime surfaces this list via version_check so
  # the picker can populate without authenticating. Each mode
  # overrides min/max/query for the matchmaker ticket. When the
  # client passes no `game_mode` ticket property, the matchmaker
  # falls back to the top-level min_players/max_players above
  # (rollout backstop for pre-4.7 clients). The default-flagged
  # entry is the initial pick if the user has never opened the
  # picker.
  modes:
    - id: ffa
      display_name_key: MODE.FFA_NAME
      description_key: MODE.FFA_DESC
      min_players: 2
      max_players: 4
      query: "+properties.game_mode:ffa"
      is_default: true
    - id: duo
      display_name_key: MODE.DUO_NAME
      description_key: MODE.DUO_DESC
      min_players: 2
      max_players: 2
      query: "+properties.game_mode:duo"
      is_default: false

# Leaderboards owned by this game. The runtime creates each one in
# Nakama as `{game_id}_{id}` (hopnbop_ffa) at boot and on every
# register_game, authoritative: only match_end writes records, one
# per matched player, with their in-match score. Nakama never
# changes a board that already exists, so a change to sort,
# operator, or reset_schedule needs the board (and every record on
# it) deleted to be recreated. match_end writes `ffa` and the
# website's public leaderboard (web/leaderboard/) reads it, so
# don't rename it. See PLATFORM_ARCHITECTURE.md "Leaderboards".
leaderboards:
  - id: ffa
    sort: desc
    operator: best
    reset_schedule: null

# Legal documents shipped in the client. Paths are relative to
# the game's project root.
#
# `legal_version` is the consent version. The runtime serves it
# to clients through `version_check`, and the consent screen
# re-prompts any player whose stored consent names a different
# version. `LEGAL_VERSION` in `src/core/legal_version.gd` is the
# client's offline fallback. Bump both in the same commit:
# pr-validate's "Check legal_version parity" step fails the build
# when they differ.
#
# Sync a bump (`scripts/sync-game-config.ps1`) with the release
# that ships the new legal text, never before. Synced early, it
# makes clients that still bundle the old text ask players to
# re-consent to that old text, and those players are then never
# shown the new text. Every sync posts this whole file, so a sync
# for any other reason (a server-only deploy, say) publishes a
# pending bump too.
legal:
  terms_path: legal/en/terms.txt
  privacy_path: legal/en/privacy.txt
  data_deletion_path: legal/en/data_deletion.txt
  legal_version: "1.2"
