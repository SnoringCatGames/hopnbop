name: PR Validate

# Phase G replacement for the legacy AWS-flavored test workflow.
# Runs on every PR targeting main:
#   - GDScript formatter check (addons/gdscript_formatter)
#   - GUT unit + integration (per-file; no backend, see the job)
#   - go test / go vet / staticcheck for the Nakama runtime
#     modules in third_party/snoringcat-platform/runtime/
#   - go vet / build for the Pulumi project in
#     third_party/snoringcat-platform/infra/pulumi/snoringcat-platform/
#
# AWS-specific tests (SAM build, moto-mocked DDB, GameLift
# integration) are intentionally absent — they're going away
# with Phase F.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  gdscript-format:
    name: GDScript formatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
      - name: Run gdscript_formatter --check
        run: |
          # The formatter addon is committed; running with --check
          # produces a non-zero exit when formatting is off.
          if [ -d addons/gdscript_formatter ]; then
            godot --headless --path . \
              --script addons/gdscript_formatter/cli.gd -- --check
          else
            echo "gdscript_formatter not vendored; skipping"
          fi

  game-config-parity:
    name: game.yaml ↔ project.godot parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check game.yaml does not define derived versions
        run: |
          # This used to check that game.yaml::protocol_version
          # equalled project.godot's. That parity check existed only
          # because the value was duplicated in both files — and its
          # unguarded sibling, display_version, duly drifted to
          # 0.39.0 against a 0.47.0 client.
          #
          # Both are now injected from project.godot by
          # scripts/sync-game-config.ps1, so the duplication is gone
          # and there is nothing to keep in parity. What's worth
          # guarding instead is the ownership rule: if someone
          # re-adds either field to game.yaml, a stale literal would
          # silently win over project.godot and we'd be back to
          # square one.
          #
          # See "WHO OWNS WHAT" at the top of game.yaml.
          set -e
          if [ ! -f game.yaml ]; then
            echo "::error::game.yaml missing at repo root"
            exit 1
          fi
          fail=0
          for field in protocol_version display_version; do
            if grep -qE "^${field}:" game.yaml; then
              echo "::error::game.yaml must not define ${field} — it is injected from project.godot at sync time. Remove it from game.yaml and bump it in project.godot instead."
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          # Both must still be readable from project.godot, since the
          # sync now depends on them entirely.
          godot_proto=$(grep -E '^config/protocol_version' \
            project.godot | head -n1 | awk -F'=' '{print $2}' \
            | tr -d ' \r')
          godot_ver=$(sed -nE 's/^config\/version="(.+)"$/\1/p' \
            project.godot | head -n1)
          if [ -z "$godot_proto" ] || [ -z "$godot_ver" ]; then
            echo "::error::could not read config/protocol_version or config/version from project.godot"
            exit 1
          fi
          echo "ok: game.yaml defers to project.godot (protocol=$godot_proto version=$godot_ver)"
      - name: Check legal_version parity
        run: |
          # game.yaml::legal.legal_version MUST equal
          # src/core/legal_version.gd::LEGAL_VERSION, or the
          # consent screen will force re-consent on first online
          # boot (the runtime-reported value wins when present;
          # the constant is only the offline / pre-fetch fallback,
          # so a mismatch is annoying-but-safe rather than a hard
          # outage — still worth catching at PR time).
          # See MULTI_GAME_ROADMAP.md Stage 3.10.
          set -e
          if [ ! -f src/core/legal_version.gd ]; then
            echo "::error::src/core/legal_version.gd missing"
            exit 1
          fi
          # game.yaml block:
          #   legal:
          #     legal_version: "1.1"
          # Extract the value (strip quotes / whitespace / CR).
          yaml_v=$(grep -E '^[[:space:]]+legal_version:' game.yaml \
            | head -n1 | awk -F':' '{print $2}' \
            | tr -d ' "\r')
          # legal_version.gd:
          #   const LEGAL_VERSION := "1.1"
          godot_v=$(grep -E '^const LEGAL_VERSION' \
            src/core/legal_version.gd | head -n1 \
            | awk -F':=' '{print $2}' | tr -d ' "\r')
          echo "game.yaml::legal.legal_version = $yaml_v"
          echo "legal_version.gd::LEGAL_VERSION = $godot_v"
          if [ -z "$yaml_v" ] || [ -z "$godot_v" ]; then
            echo "::error::could not parse legal_version from one of the files"
            exit 1
          fi
          if [ "$yaml_v" != "$godot_v" ]; then
            echo "::error::legal_version mismatch: game.yaml=$yaml_v vs legal_version.gd=$godot_v"
            exit 1
          fi
          echo "ok: legal_version matches ($yaml_v)"

  godot-tests:
    name: GUT unit + integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No backend services. None of these tests talk to a Nakama
    # server: the platform RPC paths are covered by the
    # snoringcat-platform compliance suite, which brings up its own
    # stack (compliance-matrix.yml). This job used to declare
    # nakama + postgres service containers for a "Bring up Nakama
    # in CI" step that was never written. The nakama container got
    # `--entrypoint /bin/sh` and no command, exited at once, and
    # failed every run at "Initialize containers" from 930f9806
    # (2026-04-29) on.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
      - name: Bridge snoringcat_platform_client addon
        # Same as game-server.yml. The addon's source lives in the
        # submodule and is copied into addons/ (gitignored) by
        # scripts/setup-platform-addon.ps1 locally. Without it the
        # Platform autoload doesn't load and global.gd fails to
        # compile, so most test files fail.
        #
        # The copy alone isn't enough. The submodule doesn't track
        # the addon's .uid files, so --import mints them from each
        # script's path and contents, and project.godot names the
        # Platform autoload only by UID. That UID was minted on
        # Windows, where the submodule checks out with CRLF
        # endings. This LF checkout mints a different one
        # (uid://dpe7koncinbw2, not uid://ct6lgui116ppb), and the
        # autoload stops resolving. Give platform.gd whatever UID
        # project.godot names, as a Windows checkout would.
        run: |
          rm -rf addons/snoringcat_platform_client
          cp -r \
            third_party/snoringcat-platform/addons/snoringcat_platform_client \
            addons/snoringcat_platform_client
          uid=$(sed -nE 's|^Platform="\*(uid://[a-z0-9]+)"$|\1|p' project.godot)
          if [ -n "$uid" ]; then
            echo "$uid" > addons/snoringcat_platform_client/core/platform.gd.uid
            echo "platform.gd pinned to $uid (from project.godot)"
          fi
      - name: Import project
        # A fresh checkout has no .godot/ cache, so no class_name is
        # registered. GUT checks for its own classes first and, when
        # they are missing, quits with exit code 0 having run
        # nothing, which is how this job could have gone green
        # without testing anything. --import exits non-zero on
        # harmless warnings, so judge it by the class cache instead.
        run: |
          godot --headless --import || echo "::warning::godot --import exited non-zero; checking the class cache"
          if ! grep -q '"GutTest"' .godot/global_script_class_cache.cfg; then
            echo "::error::--import did not register class_names (GutTest missing from .godot/global_script_class_cache.cfg)"
            exit 1
          fi
      - name: Run GUT (per-file)
        run: |
          # One file per Godot process. Directory mode misses
          # discovery on this project (see hopnbop CLAUDE.md
          # "Project-Specific Testing Notes"), and a fresh process
          # keeps one file's autoload state out of the next.
          #
          # Every file runs even after a failure, and a file that
          # exits 0 without running a test counts as a failure:
          # GUT reports "Nothing was run" with exit code 0 for a
          # parse error, a missing import, or a file with no tests.
          #
          # Each process gets an empty user:// (XDG_DATA_HOME), so
          # none can start from auth state another one persisted.
          # A stored, non-anonymous session would make
          # PlatformAuthApiClient auto-refresh it against
          # production Nakama on the first frame, before any test
          # code runs. The post-run hook fails the file if the
          # Nakama SDK sent anything at all.
          #
          # Actions runs this with `bash -e`; turn errexit off so a
          # failing file doesn't end the loop. The last line
          # decides the step's result.
          set +e
          set -uo pipefail
          mapfile -t files < <(find test/unit test/integration \
            -name 'test_*.gd' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no test_*.gd files under test/unit or test/integration"
            exit 1
          fi
          logs="$RUNNER_TEMP/gut-logs"
          mkdir -p "$logs"
          total_tests=0
          failed=()
          for f in "${files[@]}"; do
            log="$logs/${f//\//_}.log"
            echo "::group::$f"
            XDG_DATA_HOME="$(mktemp -d)" timeout 300 \
              godot --headless -s --path . addons/gut/gut_cmdln.gd \
              -gtest="res://$f" -gexit \
              -gpost_run_script=res://test/hooks/fail_on_nakama_traffic.gd \
              2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            tests=$(sed -nE 's/^Tests +([0-9]+)$/\1/p' "$log" | tail -n1)
            tests=${tests:-0}
            total_tests=$((total_tests + tests))
            reason=""
            if [ "$rc" -eq 124 ]; then
              reason="timed out after 300s"
            elif grep -q 'NAKAMA TRAFFIC' "$log"; then
              reason="sent requests through the Nakama SDK"
            elif [ "$rc" -ne 0 ]; then
              reason="GUT exited $rc"
            elif [ "$tests" -eq 0 ]; then
              reason="exited 0 but ran no tests"
            fi
            if [ -n "$reason" ]; then
              failed+=("$f: $reason")
              echo "::error file=$f::$reason"
            fi
            echo "$f: $tests tests, exit $rc"
          done
          summary="GUT: ${#files[@]} files, $total_tests tests, ${#failed[@]} failed"
          echo "$summary"
          {
            echo "$summary"
            for x in "${failed[@]}"; do echo "- $x"; done
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${#failed[@]}" -eq 0 ]

  nakama-runtime-go:
    name: Nakama runtime Go check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: third_party/snoringcat-platform/runtime
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - run: go vet ./...
      - run: go test ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

  pulumi-go-build:
    name: Pulumi project compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: third_party/snoringcat-platform/infra/pulumi/snoringcat-platform
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - run: go vet ./...
      - run: go build ./...
